<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>房屋管理系统</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 引入Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入自定义CSS -->
    <link rel="stylesheet" href="/static/lib/css/signin.css">
    <link rel="stylesheet" href="/static/lib/css/login.css">
    <!-- 引入JS库 -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@2.1.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/js/bootstrap.min.js"></script>
</head>
<body>
<div th:insert="~{./common/headbar::headbar}"></div>
<div class="container">
    <!-- AI新闻窗口 -->
    <div class="news-container">
        <div class="news-title">AI每日快讯</div>
        <div id="newsContent" class="loading">
            <div class="loading-spinner"></div>
        </div>
    </div>

    <!-- 登录表单 -->
    <form class="form-signin" action="/housemanage/login2">
        <div class="img-login">
            <img src="/static/lib/images/qc0.jpg" alt="leader" height="450" width="300" >
        </div>
        <h2 class="form-signin-heading">登录界面</h2>
        <label for="username" class="sr-only">用户名</label>
        <input type="text" class="form-control" placeholder="请输入用户名" required autofocus name="username" id="username">
        <label for="password" class="sr-only">密码</label>
        <input type="password" name="password" class="form-control" placeholder="请输入密码" id="password">
        <button class="btn btn-lg btn-primary btn-block" type="submit">Sign in</button>
    </form>
</div>

<!-- 引入API和UI处理逻辑 -->
<script src="/static/lib/js/news-api.js"></script>
</body>
</html>
