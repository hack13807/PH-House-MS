server:
  port: 8080
  # Tomcat服务器配置
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true
  tomcat:
    max-threads: 200
    connection-timeout: 5000
    max-connections: 10000
    accept-count: 500
    threads:
      max: 800
      min-spare: 100

spring:
  # 激活的配置文件，默认使用prod（使用H2）
  profiles:
    active: prod
  application:
    name: ph-house
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    mode: HTML
    
  # MVC配置
  mvc:
    async:
      request-timeout: 60000
    throw-exception-if-no-handler-found: true
    converters:
      preferred-json-mapper: jackson
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # RestTemplate配置
  resttemplate:
    read-timeout: 60000
    connect-timeout: 60000
  # Jackson配置
  jackson:
    default-property-inclusion: NON_NULL
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  # Web资源配置
  web:
    resources:
      add-mappings: false

# 日志配置
logging:
  level:
    org:
      springframework:
        web: INFO
    com:
      panghu:
        housemanage: INFO
      baomidou:
        mybatisplus: INFO

mybatis-plus:
  # Mapper.xml 文件位置
  mapper-locations: classpath*:mapper/*Mapper.xml
  type-aliases-package: com.panghu.housemanage.pojo
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 是否开启自动驼峰命名规则（camel case）映射
    map-underscore-to-camel-case: true
  global-config:
    # 是否控制台 print mybatis-plus 的 LOGO
    banner: false
    db-config:
      # id类型
      id-type: auto
      # 表名是否使用下划线命名，默认数据库表使用下划线命名
      table-underline: true

