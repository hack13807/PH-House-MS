<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>房屋租赁管理平台</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/lib/css/homepage.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@2.1.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/js/bootstrap.min.js"></script>
</head>
<body>
<div th:include="../static/common/headbar::headbar"></div>
<div class="container">
    <div class="row" style="margin-top: 70px;">
        <div class="col-md-12">
            <div class="panel panel-default">
                <div class="panel-heading">
                    <h3 class="panel-title">功能导航</h3>
                </div>
                <div class="panel-body">
                    <div class="row">
                        <div class="col-md-3">
                            <div class="feature-box">
                                <h4>预约图书</h4>
                                <p>在线预约您想借阅的图书</p>
                                <a href="/managebooks/booklist" class="btn btn-primary">进入</a>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="feature-box">
                                <h4>查看预约情况</h4>
                                <p>查看您的预约记录</p>
                                <a href="/managebooks/reservation" class="btn btn-primary">进入</a>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="feature-box">
                                <h4>退还图书</h4>
                                <p>归还已借阅的图书</p>
                                <a href="/managebooks/borrow" class="btn btn-primary">进入</a>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="feature-box">
                                <h4>更多功能</h4>
                                <p>敬请期待</p>
                                <a href="#" class="btn btn-primary">进入</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
