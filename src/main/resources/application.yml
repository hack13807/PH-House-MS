---
# 开发环境配置，使用MySQL数据库
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    name: hms
    url: jdbc:mysql://127.0.0.1:3306/hms?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: admin
    # 使用druid数据源
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver

---
# 生产环境配置，使用H2嵌入式数据库
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    name: hms
    url: jdbc:h2:file:./data/hms;MODE=MYSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;IGNORECASE=TRUE;AUTO_SERVER=TRUE
    username: sa
    password: 
    # 使用druid数据源
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.h2.Driver
    # Druid连接池配置
    druid:
      # 初始化大小，最小，最大
      initial-size: 5
      min-idle: 5
      max-active: 20
      # 配置获取连接等待超时的时间
      max-wait: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      time-between-eviction-runs-millis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: true
      test-on-return: false
      # 打开PSCache，并且指定每个连接上PSCache的大小
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      # 连接出错时重试
      break-after-acquire-failure: false
      connection-error-retry-attempts: 3
      # 连接出错时的判断依据
      filters: stat,wall
      # 合并多个DruidDataSource的监控数据
      use-global-data-source-stat: true
  # H2控制台配置
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: true
  # 初始化数据库
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      encoding: UTF-8
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  # 配置连接池参数
  hikari:
    minimum-idle: 5
    maximum-pool-size: 15
    connection-timeout: 30000
    idle-timeout: 180000
    max-lifetime: 1800000
    connection-test-query: SELECT 1
    validation-timeout: 5000
    auto-commit: true
  flyway:
    enabled: false
